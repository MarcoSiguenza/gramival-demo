<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gramival - Demo de cotizaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Todo el contenido se dibuja aqui desde app.js -->
    <div id="app"></div>

    <!-- Modal reutilizable -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Título</h2>

                <button id="modalCloseBtn" class="modal-close">
                    ✕
                </button>
            </div>

            <div id="modalBody" class="modal-body">
            </div>

            <div id="modalFooter" class="modal-footer">
            </div>
        </div>
    </div>
    
    <!-- Orden: datos -> componentes reutilizables -> modulos -> aplicacion -->
    <script src="js/data.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/prices.js"></script>
    <script src="js/products.js"></script>
    <script src="js/freight.js"></script>
    <script src="js/app.js"></script>

  </body>
</html>
